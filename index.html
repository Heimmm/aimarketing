<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🤖 AI 热点营销参谋 · 今日灵感版</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body { background: #f4f6fa; font-family: 'Segoe UI', system-ui, sans-serif; }
        .navbar-brand { font-weight: 700; color: #6c5ce7 !important; }
        .card { border-radius: 16px; transition: transform 0.2s, box-shadow 0.2s; height: 100%; border: none; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,0.08); }
        .hot-badge { background: #ff4757; color: white; font-size: 0.7rem; padding: 3px 10px; border-radius: 30px; display: inline-block; }
        .heat-bar { height: 6px; border-radius: 4px; background: #e9ecef; margin: 8px 0; overflow: hidden; }
        .heat-fill { height: 100%; background: linear-gradient(90deg, #6c5ce7, #a29bfe); border-radius: 4px; }
        .event-date-badge { font-size: 0.75rem; background: #e9ecef; padding: 2px 12px; border-radius: 30px; color: #495057; }
        .source-tag { font-size: 0.7rem; background: #dfe6e9; padding: 2px 10px; border-radius: 30px; color: #2d3436; }
        .footer { margin-top: 40px; text-align: center; color: #868e96; font-size: 0.85rem; }
        .error-banner { background: #f8d7da; color: #721c24; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #f5c6cb; }
        .loading-placeholder { min-height: 200px; display: flex; align-items: center; justify-content: center; }
        .ai-badge { background: #6c5ce7; color: white; font-size: 0.65rem; padding: 2px 10px; border-radius: 30px; }
        .suggestion-item { background: #f8f9fa; border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; border-left: 3px solid #6c5ce7; }
        .case-item { background: #fff3cd; border-radius: 8px; padding: 12px 16px; margin-top: 12px; border-left: 3px solid #ffc107; }
        .category-tag { font-size: 0.7rem; background: #e3f2fd; color: #0d6efd; padding: 2px 12px; border-radius: 30px; }
        .data-source-info { font-size: 0.75rem; color: #6c757d; }
        .simulated-badge { background: #ffc107; color: #212529; padding: 2px 8px; border-radius: 30px; font-size: 0.65rem; }
        .marketing-direction { background: white; border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; border-left: 4px solid #6c5ce7; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .marketing-direction h5 { font-weight: 600; color: #2d3436; }
        .marketing-direction .badge-platform { background: #e9ecef; color: #495057; font-weight: 400; }
        .marketing-direction .example { color: #636e72; font-size: 0.9rem; }
        @media (max-width: 576px) { .navbar-brand { font-size: 1.2rem; } }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-robot text-primary"></i> AI 热点营销参谋</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#marketing-tips">今日灵感</a></li>
                    <li class="nav-item"><a class="nav-link" href="#future">未来7天</a></li>
                    <li class="nav-item"><a class="nav-link" href="#history">历史事件</a></li>
                    <li class="nav-item">
                        <button class="btn btn-outline-primary btn-sm ms-2" id="refreshBtn">
                            <i class="fas fa-sync-alt"></i> 刷新
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div id="globalError" class="error-banner" style="display:none;"></div>

        <!-- 今日营销灵感 -->
        <section id="marketing-tips">
            <h2 class="mb-4"><i class="fas fa-lightbulb text-warning"></i> 今日营销灵感与方向 <span class="badge ai-badge ms-2"><i class="fas fa-brain"></i> AI 生成</span></h2>
            <div id="marketingTipsContainer">
                <div class="loading-placeholder text-muted"><i class="fas fa-spinner fa-spin me-2"></i>AI 正在分析今日营销机会...</div>
            </div>
        </section>

        <!-- 未来7天 -->
        <section id="future" class="mt-5">
            <h2 class="mb-4"><i class="fas fa-calendar-alt text-primary"></i> 未来 7 天事件 <span class="badge ai-badge ms-2"><i class="fas fa-brain"></i> AI 生成</span></h2>
            <div class="row" id="futureEvents"><div class="col-12 loading-placeholder text-muted"><i class="fas fa-spinner fa-spin me-2"></i>加载中...</div></div>
        </section>

        <!-- 历史事件 -->
        <section id="history" class="mt-5">
            <h2 class="mb-4"><i class="fas fa-history text-secondary"></i> 历史事件回顾 <span class="badge ai-badge ms-2"><i class="fas fa-brain"></i> AI 生成</span></h2>
            <div class="row" id="historyEvents"><div class="col-12 loading-placeholder text-muted"><i class="fas fa-spinner fa-spin me-2"></i>加载中...</div></div>
        </section>

        <div class="footer">
            <p>🤖 所有内容由 <strong>智谱AI · GLM-4-Flash</strong> 免费大模型生成，点击事件卡片查看深度建议</p>
        </div>
    </div>

    <!-- 模态框（复用） -->
    <div class="modal fade" id="marketingModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-robot text-primary"></i> AI 营销建议 &amp; 案例</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBody">
                    <div class="text-center text-muted py-4"><i class="fas fa-spinner fa-spin me-2"></i>AI 正在生成...</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ================================================================
        //  配置
        // ================================================================
        const ZHIPU_API_KEY = 'your api key';

        // ================================================================
        //  工具函数
        // ================================================================
        function getToday() {
            const d = new Date();
            return { month: d.getMonth() + 1, day: d.getDate() };
        }

        function dateDisplay(month, day) { return `${month}月${day}日`; }

        function showGlobalError(msg) {
            const el = document.getElementById('globalError');
            el.textContent = '⚠️ ' + msg;
            el.style.display = 'block';
        }

        function hideGlobalError() { document.getElementById('globalError').style.display = 'none'; }

        // ================================================================
        //  通用 AI 调用
        // ================================================================
        async function callAI(prompt, retries = 2) {
            for (let attempt = 0; attempt <= retries; attempt++) {
                try {
                    const response = await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${ZHIPU_API_KEY}`
                        },
                        body: JSON.stringify({
                            model: 'glm-4-flash',
                            messages: [
                                { role: 'system', content: '你是一个专业的数据生成助手，只输出合法JSON，不要包含任何其他文字。' },
                                { role: 'user', content: prompt }
                            ],
                            temperature: 0.7,
                            max_tokens: 2500
                        })
                    });

                    if (!response.ok) {
                        const errText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errText}`);
                    }

                    const data = await response.json();
                    const content = data.choices?.[0]?.message?.content || '';
                    let jsonStr = content;
                    const match = content.match(/```json\s*([\s\S]*?)\s*```/);
                    if (match) jsonStr = match[1];
                    return JSON.parse(jsonStr);
                } catch (e) {
                    console.error(`AI调用失败 (尝试 ${attempt+1}/${retries+1}):`, e);
                    if (attempt === retries) throw e;
                    await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
                }
            }
        }

        // ================================================================
        //  AI 生成今日营销灵感
        // ================================================================
        async function generateMarketingDirections() {
            const today = getToday();
            const prompt = `
        今天是 ${today.month} 月 ${today.day} 日。请根据历史营销经验、常见节日和事件，为社交媒体运营者提供今天可行的营销方向和灵感。

        请输出 JSON 数组，每个元素包含：
        - "title": 建议标题（简短有力，比如 "七夕预热：浪漫经济正当时"）
        - "direction": 具体营销方向描述（100字以内）
        - "platforms": 推荐平台数组（如 ["微博","小红书","抖音"]）
        - "creative": 内容创意建议（如 "发起#七夕告白计划#，鼓励用户晒出情侣照"）
        - "example": 案例参考（类似营销活动的成功案例，简短）

        输出格式：
        [
          {
            "title": "...",
            "direction": "...",
            "platforms": ["平台1","平台2"],
            "creative": "...",
            "example": "..."
          }
        ]
        要求：生成 5-8 条，涵盖不同领域（节日、科技、社会、娱乐等），贴合今天实际可能发生的事件。
        只输出数组，不要其他内容。
        `;
            const result = await callAI(prompt);
            if (!Array.isArray(result)) throw new Error('AI返回非数组');
            return result;
        }

        // ================================================================
        //  渲染营销灵感
        // ================================================================
        function renderMarketingTips(directions) {
            const container = document.getElementById('marketingTipsContainer');
            if (!directions || directions.length === 0) {
                container.innerHTML = `<div class="text-center text-muted py-4"><i class="fas fa-inbox me-2"></i>暂无建议</div>`;
                return;
            }

            let html = `<p class="text-muted mb-3">基于今天的日期和营销历史数据，AI 为你找到以下可借势的方向：</p>`;
            directions.forEach((item, idx) => {
                const platforms = (item.platforms || []).map(p =>
                    `<span class="badge badge-platform me-1">${p}</span>`
                ).join('');

                html += `
                        <div class="marketing-direction">
                            <h5><span class="badge bg-primary me-2">${idx+1}</span> ${item.title || '营销方向'}</h5>
                            <p class="mt-2">${item.direction || '（无描述）'}</p>
                            <div class="mb-2">
                                <strong>🎯 内容创意：</strong> ${item.creative || '暂无'} 
                            </div>
                            <div>
                                <strong>📱 推荐平台：</strong> ${platforms || '不限'} 
                            </div>
                            ${item.example ? `<div class="mt-2"><strong>📌 案例参考：</strong> ${item.example}</div>` : ''}
                        </div>
                    `;
            });
            container.innerHTML = html;
        }

        // ================================================================
        //  生成未来7天事件（AI）
        // ================================================================
        async function generateFutureEvents() {
            const today = new Date();
            const prompt = `
        请生成未来7天（从今天 ${today.getFullYear()}-${today.getMonth()+1}-${today.getDate()} 开始）内可能发生的重大事件、节日、纪念日或行业活动，共12-15个。
        要求：
        1. 涵盖国内外，包括节日、科技发布会、体育赛事、文化纪念日等。
        2. 每个事件包含：标题、具体日期（格式：月/日，如 8/4）、类别（如"节日"、"科技"等）。
        3. 输出JSON数组，格式：[{"title":"七夕节","date":"8/4","category":"节日"}]
        只输出数组。
        `;
            const result = await callAI(prompt);
            if (!Array.isArray(result)) throw new Error('AI返回非数组');
            return result.map(item => ({
                title: item.title || '未知事件',
                date: item.date || '日期不详',
                category: item.category || '事件',
                source: 'AI生成'
            }));
        }

        // ================================================================
        //  生成历史事件（AI）
        // ================================================================
        async function generateHistoryEvents() {
            const today = new Date();
            const prompt = `
        请生成过去7天（从今天 ${today.getFullYear()}-${today.getMonth()+1}-${today.getDate()} 往前推7天）内发生的重要历史事件或近期热点，共12-15个。
        要求：
        1. 可以是历史上的今天发生的事件，也可以是近期真实发生的热点新闻。
        2. 每个事件包含：标题、日期（格式：月/日，如 7/20）、类别（如"历史"、"科技"等）。
        3. 输出JSON数组，格式：[{"title":"爱因斯坦发表相对论","date":"7/20","category":"科学"}]
        只输出数组。
        `;
            const result = await callAI(prompt);
            if (!Array.isArray(result)) throw new Error('AI返回非数组');
            return result.map(item => ({
                title: item.title || '未知事件',
                date: item.date || '日期不详',
                category: item.category || '历史',
                source: 'AI生成'
            }));
        }

        // ================================================================
        //  渲染事件卡片（复用）
        // ================================================================
        function renderEventCards(containerId, events, type, dateLabel) {
            const container = document.getElementById(containerId);
            if (!container) return;

            if (!events || events.length === 0) {
                container.innerHTML =
                    `<div class="col-12 text-center text-muted py-4"><i class="fas fa-inbox me-2"></i>暂无数据</div>`;
                return;
            }

            let html = '';
            events.forEach((event, index) => {
                const heat = event.hot || Math.floor(Math.random() * 50 + 40);
                const title = event.title || '未知事件';
                const dateStr = event.date || dateLabel || '日期不详';
                const url = event.url || '#';

                let typeBadge = '';
                if (type === 'future') typeBadge =
                    '<span class="badge bg-success"><i class="far fa-calendar-plus"></i> 即将</span>';
                else if (type === 'history') typeBadge =
                    '<span class="badge bg-secondary"><i class="fas fa-undo-alt"></i> 回顾</span>';

                const category = event.category || '事件';

                html += `
                        <div class="col-md-6 col-lg-4 mb-4">
                            <div class="card event-card h-100" style="cursor: pointer;" 
                                 data-title="${title.replace(/"/g, '&quot;')}"
                                 data-date="${dateStr}"
                                 data-url="${url}"
                                 data-event-id="${index}">
                                <div class="card-body d-flex flex-column">
                                    <div class="d-flex justify-content-between align-items-start">
                                        <div>
                                            <span class="source-tag">${event.source || 'AI'}</span>
                                            ${typeBadge}
                                        </div>
                                        <span class="event-date-badge">${dateStr}</span>
                                    </div>
                                    <h5 class="card-title mt-2">${title}</h5>
                                    <div class="mt-1">
                                        <span class="badge bg-danger bg-opacity-10 text-danger me-1">热度 ${heat}</span>
                                        <span class="category-tag">${category}</span>
                                        <div class="heat-bar"><div class="heat-fill" style="width:${Math.min(heat,100)}%;"></div></div>
                                    </div>
                                    <div class="mt-auto pt-3">
                                        <button class="btn btn-outline-primary btn-sm w-100" onclick="event.stopPropagation(); openMarketingModal(this)">
                                            <i class="fas fa-robot"></i> AI 生成营销建议
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
            });

            container.innerHTML = html;

            // 绑定卡片点击
            document.querySelectorAll(`#${containerId} .event-card`).forEach(card => {
                card.addEventListener('click', function(e) {
                    if (e.target.closest('.btn')) return;
                    openMarketingModalFromCard(this);
                });
            });
        }

        // ================================================================
        //  营销建议生成（给事件用的）
        // ================================================================
        async function generateAIMarketing(eventTitle, eventDate, context = '') {
            const prompt = `
        你是一位资深的社交媒体营销专家。请针对以下事件，生成专业的营销建议。

        事件标题：${eventTitle}
        事件日期：${eventDate}
        ${context ? '附加背景：' + context : ''}

        请按以下 JSON 格式输出（不要包含任何其他文字）：
        {
          "tips": [
            "建议1：具体可执行的营销策略",
            "建议2：具体可执行的营销策略",
            "建议3：具体可执行的营销策略",
            "建议4：具体可执行的营销策略",
            "建议5：具体可执行的营销策略"
          ],
          "case": "一个真实的或合理的营销案例，说明类似事件如何成功借势"
        }

        要求：
        1. 建议要具体、可执行，包含平台、内容形式、互动方式等
        2. 案例要真实可信，有数据支撑
        3. 紧扣事件本身，不要泛泛而谈
        4. 只输出 JSON，不要其他内容
        `;

            try {
                const response = await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${ZHIPU_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'glm-4-flash',
                        messages: [
                            { role: 'system', content: '你是一位资深的社交媒体营销专家，擅长借势营销和热点策划。' },
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.7,
                        max_tokens: 800
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`API 请求失败 (${response.status}): ${errText}`);
                }

                const data = await response.json();
                const content = data.choices?.[0]?.message?.content || '';
                let jsonStr = content;
                const match = content.match(/```json\s*([\s\S]*?)\s*```/);
                if (match) jsonStr = match[1];
                const result = JSON.parse(jsonStr);
                return {
                    success: true,
                    tips: result.tips || ['AI 生成的营销建议'],
                    case: result.case || '暂无案例'
                };
            } catch (error) {
                console.error('AI 生成失败:', error);
                return {
                    success: false,
                    error: error.message || 'AI 服务暂时不可用'
                };
            }
        }

        // ================================================================
        //  模态框
        // ================================================================
        async function openMarketingModalFromCard(card) {
            const title = card.dataset.title || '事件';
            const date = card.dataset.date || '';
            const url = card.dataset.url || '';

            const modal = new bootstrap.Modal(document.getElementById('marketingModal'));
            const body = document.getElementById('modalBody');

            body.innerHTML = `
                        <div class="text-center py-4">
                            <i class="fas fa-spinner fa-spin fa-2x text-primary mb-3"></i>
                            <p class="text-muted">🤖 AI 正在为「${title}」生成营销建议...</p>
                            <small class="text-muted">使用智谱 AI · GLM-4-Flash 免费模型</small>
                        </div>
                    `;
            modal.show();

            const result = await generateAIMarketing(title, date, url ? `相关链接：${url}` : '');

            if (result.success) {
                let tipsHtml = result.tips.map(tip =>
                    `<div class="suggestion-item"><i class="fas fa-check-circle text-success me-2"></i> ${tip}</div>`
                ).join('');

                body.innerHTML = `
                            <h5 class="mb-3">${title}</h5>
                            <div class="mb-2 text-muted small">📅 ${date}</div>
                            <h6><i class="fas fa-robot text-primary"></i> AI 营销建议</h6>
                            ${tipsHtml}
                            <div class="case-item">
                                <h6><i class="fas fa-star text-warning"></i> 案例参考</h6>
                                <p class="mb-0">${result.case}</p>
                            </div>
                            <div class="mt-3 alert alert-info" role="alert">
                                <i class="fas fa-info-circle"></i> 建议结合品牌定位和目标受众，选择 1-2 个切入点深度运营。
                                <br><small class="text-muted">🤖 本建议由 AI 自动生成，仅供参考</small>
                            </div>
                        `;
            } else {
                body.innerHTML = `
                            <div class="alert alert-danger">
                                <h6><i class="fas fa-exclamation-triangle"></i> AI 生成失败</h6>
                                <p>${result.error || '未知错误，请稍后重试'}</p>
                                <hr>
                                <p class="mb-0 text-muted small">提示：请检查 API Key 是否正确，或网络是否通畅。</p>
                            </div>
                            <div class="mt-3">
                                <h6>📌 事件信息</h6>
                                <p><strong>${title}</strong><br>📅 ${date}</p>
                            </div>
                        `;
            }
        }

        function openMarketingModal(btn) {
            const card = btn.closest('.event-card');
            if (card) {
                openMarketingModalFromCard(card);
            }
        }

        // ================================================================
        //  主加载
        // ================================================================
        async function loadAllData() {
            hideGlobalError();

            // ----- 1. 今日营销灵感 -----
            try {
                const directions = await generateMarketingDirections();
                renderMarketingTips(directions);
            } catch (e) {
                showGlobalError('营销灵感生成失败：' + e.message);
                document.getElementById('marketingTipsContainer').innerHTML =
                    `<div class="alert alert-warning">生成失败，请刷新重试</div>`;
            }

            // ----- 2. 未来7天 -----
            try {
                const futureData = await generateFutureEvents();
                renderEventCards('futureEvents', futureData.slice(0, 15), 'future', '未来7天');
            } catch (e) {
                showGlobalError('未来事件生成失败：' + e.message);
                renderEventCards('futureEvents', [], 'future', '');
            }

            // ----- 3. 历史事件 -----
            try {
                const historyData = await generateHistoryEvents();
                renderEventCards('historyEvents', historyData.slice(0, 15), 'history', '历史回顾');
            } catch (e) {
                showGlobalError('历史事件生成失败：' + e.message);
                renderEventCards('historyEvents', [], 'history', '');
            }
        }

        // ================================================================
        //  刷新
        // ================================================================
        document.getElementById('refreshBtn').addEventListener('click', function() {
            const btn = this;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 刷新中...';
            btn.disabled = true;
            loadAllData().then(() => {
                btn.innerHTML = '<i class="fas fa-sync-alt"></i> 刷新';
                btn.disabled = false;
            });
        });

        document.addEventListener('DOMContentLoaded', loadAllData);
    </script>
</body>
</html>
